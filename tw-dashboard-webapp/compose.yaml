services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: tw
      POSTGRES_PASSWORD: tw
      POSTGRES_DB: tw_dashboard
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - tw_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tw -d tw_dashboard']
      interval: 5s
      retries: 10
volumes:
  tw_pg:
